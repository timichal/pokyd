<!DOCTYPE html>
<!-- IQ Pokyd - index.html - phase 5.1 of PLAN.md, and the Vite entry point.

     The whole page: a mount point and the module that fills it. Everything a
     visitor sees is built in src/app/chat.ts, which phase 6.3 turned into the
     author's own main window -- the stretched photograph, IDR_MENU with its
     live "name x name, character: mood" caption, his three headings, his
     colours and his bottom-anchored conversation. There is nothing in this
     file for it to fight with, which is why it could be replaced rather than
     wrapped.

     lang="cs" because IQ Pokyd speaks Czech and nothing else -- it indexes a
     28-letter Czech alphabet. The charset declaration is about this file only:
     everything the engine says crosses the worker boundary as CP1250 bytes and
     is decoded by src/web/cp1250.ts, which is the one place in the project
     where a byte becomes a character.

     Written by us, not ported. -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQ Pokyd v0.15</title>
<meta name="description" content="IQ Pokyd 0.15, a 2005 Czech conversation program by Ales Janda / KYBLSoft, running in a browser.">
<!-- IDR_MAINFRAME, the icon the program wore in the task bar in 2005. Phase 6.2
     copies res/IQPokyd.ico out of the archive byte for byte rather than
     re-encode it: every browser reads ICO, it is 1,078 bytes, and the author's
     own bytes are a better favicon than our copy of them. -->
<link rel="icon" href="./src/app/assets/favicon.ico" sizes="32x32 16x16">
<link rel="stylesheet" href="./src/app/chat.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/app/main.ts"></script>
</body>
</html>

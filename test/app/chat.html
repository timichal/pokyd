<!DOCTYPE html>
<!-- IQ Pokyd - test/app/chat.html - phase 5.2 of PLAN.md, the milestone itself.

     The browser half of test/app/chat.test.mjs, and the thing it does that no
     test before it could: it holds a conversation with IQ Pokyd the way a
     visitor does. It does not import src/app/chat.ts, it does not construct a
     PokydClient and it knows nothing about the protocol. It puts the built page
     -- dist/index.html, what phase 5.3 will deploy -- in an iframe, types into
     the input, presses the button the author labelled "Rekni", and reads what
     came back out of the transcript. What node then compares against
     test/golden/rozhovor.txt is 23 answers that were on a screen.

     Twice, because a first visit and a second one are different programs. The
     first inflects 402,252 word forms and writes 18 MB to IndexedDB; the second
     is a fresh iframe with a fresh worker, a fresh wasm module and a fresh
     database connection, which finds that blob and starts in a fifth of a
     second. The conversation has to be the same one either way, and the same
     one the MinGW build printed to a console in phase 1.6.

     ?seed= is why that is even a question worth asking: rand() is what picks
     between equally-unheard answers, so the conversation is a function of the
     seed, and pinning it is the only way to compare with a file recorded in
     2026 against a program from 2005. Without it the app seeds from the clock,
     which is what the original did too (mfcDlg.cpp:363, PROSTRED.FU:307).

     Written by us, not ported. English identifiers and ASCII only, like the
     rest of the non-engine code, so every Czech letter in here is an escape.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IQ Pokyd - the conversation, in the built app</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; display: flex; }
  iframe { width: 46em; height: 32em; border: 1px solid #ccc; }
  pre { flex: 1; margin: 0; padding: 1em; overflow: auto; }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="log">running...</pre>
<script type="module">
/* The one module this page imports, and only to turn what is on the screen back
   into the bytes the golden file is written in.  Everything else it touches, it
   touches through the iframe's DOM. */
import { decodeCp1250, encodeCp1250 } from "/src/web/cp1250.ts";

/* test/golden/README.md: the settings that transcript was recorded under. */
const SEED = 20050415;
const MOOD = 3;

/* NASTAV_STANDARDNE's charakter and nalada (NASTAVEN.PR:28-29), which the
   dialog puts back at the end of a visit -- see step 7 of dialogReport. */
const RESTORE = { character: 3, mood: 3 };

/* The built app, not the sources.  test/app/chat.test.mjs runs `vite build`
   before it launches the browser, so this is the deliverable. */
const APP = "/dist/index.html?seed=" + SEED + "&mood=" + MOOD;

const stage = document.getElementById("stage");
const logEl = document.getElementById("log");
const lines = [];
function log(text) {
  lines.push(text);
  logEl.textContent = lines.join("\n");
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** Wait for a condition in the iframe, or say what it was still showing. */
async function until(what, predicate, timeoutMs = 120000) {
  const deadline = performance.now() + timeoutMs;
  for (;;) {
    /* Awaited, so that a predicate which asks the engine something can be
       written as an async function: a bare promise is always truthy. */
    const value = await predicate();
    if (value) return value;
    if (performance.now() > deadline) throw new Error("timed out waiting for " + what);
    await sleep(10);
  }
}

/* ---------------------------------------------------------------- one visit */

/* A visit is an iframe.  A second one is a second iframe: its own worker, its
   own wasm module, its own IndexedDB connection -- and the same origin, which
   is what lets it find the blob the first one left behind. */
async function visit({ kind, sentences }) {
  const frame = document.createElement("iframe");
  frame.src = APP;
  const loaded = new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = () => reject(new Error("the app page failed to load"));
  });
  stage.replaceChildren(frame);
  await loaded;

  const win = frame.contentWindow;
  const doc = frame.contentDocument;

  /* The visitor's view of "is it ready": the root element says so, and the
     input is no longer disabled.  window.pokyd is used for the report and the
     settings afterwards -- never to put a sentence in. */
  const root = await until("the chat to be mounted",
    () => doc.querySelector(".pokyd"));
  const firstState = root.dataset.state;
  const loadingShown = doc.querySelector(".pokyd-loading") !== null;

  const t0 = performance.now();
  await until("the engine to load", () => root.dataset.state === "ready");
  const loadMs = performance.now() - t0;

  /* Phase 6.4.  data-state says "ready" one settings round trip before the
     greeting and the focus land, so wait for the line rather than race it --
     everything read below happens after IQ Pokyd has said hello. */
  await until("the welcome line",
    () => doc.querySelector(".pokyd-turn") !== null, 30000);

  const input = doc.querySelector(".pokyd-input");
  const send = doc.querySelector(".pokyd-send");
  const inputLive = !input.disabled && !send.disabled;
  const loadingGone = doc.querySelector(".pokyd-loading") === null;

  /* Phase 7.3, and it is the first thing a visitor sees on a first visit:
     PRECTI_NASTAVENI_ZE_SOUBORU found no IQPOKYD.CFG, so g_zobrazitnastaveni
     is set and IDD_NASTAVENI opens by itself (mfcDlg.cpp:436, PROSTRED.FU:498).
     The second visit reads the file the first one wrote and is not asked.

     It is taken off with Storno, which applies nothing -- so the conversation
     below is held under NASTAV_STANDARDNE's own defaults either way, and the
     two visits stay the same conversation. */
  const openedOnArrival = doc.querySelector(".pokyd-dialog") !== null;
  if (openedOnArrival) {
    doc.querySelector('.pokyd-dialog-item[data-control="IDCANCEL"]').click();
    await until("the first-visit dialog to close",
      () => doc.querySelector(".pokyd-dialog") === null, 5000);
  }
  /* After the dialog, not before it: the line takes the focus when the dialog
     hands it back (mfcDlg.cpp:800, and src/app/chat.ts's openSettings). */
  const focused = doc.activeElement === input;

  /* The defaults the golden conversation leans on, read before a word is typed:
     nalada drifts as the conversation goes (INTELIG.FU:532), so after it they
     would be a measurement of that and not of NASTAV_STANDARDNE. */
  const handle = win.pokyd;
  const report = await handle.ready;
  const settings = await handle.client.getSettings();
  /* ZAPIS_DO_MENU_AKTUALNI_STAV_NASTAVENI, before a word is typed.  The
     same line is read again at the end, and the two are not expected to
     match: the mood in it moves as the conversation goes. */
  const captionBefore = doc.querySelector(".pokyd-menu-state").textContent;

  /* ------------------------------------------------------- the window, 6.3 */

  /* What phase 6.3 drew, read back off the page the same way everything else
     here is: out of the DOM and out of getComputedStyle, never out of the
     module that put it there.  node compares it with PALETTE and WINDOW_LAYOUT,
     which are read from the engine's own source by test/app/resources.test.ts,
     so the loop is closed at both ends.

     Taken after the conversation rather than before it, because two of the
     answers only exist once there are turns on the screen -- and because the
     caption is expected to have *moved* by then: nalada drifts, and the menu
     bar is where a visitor sees it. */
  function windowReport() {
    const css = (el, prop) => el === null ? null
      : win.getComputedStyle(el).getPropertyValue(prop);
    const text = (sel) => {
      const el = doc.querySelector(sel);
      return el === null ? null : el.textContent;
    };

    const client = doc.querySelector(".pokyd-client");
    const box = doc.querySelector(".pokyd-transcript");
    const clientRect = client.getBoundingClientRect();
    const boxRect = box.getBoundingClientRect();
    const human = doc.querySelector('.pokyd-turn[data-who="human"]');
    const pokyd = doc.querySelector('.pokyd-turn[data-who="pokyd"]');

    /* Phase 6.5.  Three things, and the third one moves the scroll and puts it
       back: whether the box overflows at all (with two dozen turns in a 32em
       iframe it had better, or nothing below is being tested), where it is
       resting, and whether dragging to the top actually brings the oldest turn
       into view -- which is what `justify-content: flex-end` would have made
       impossible and `margin-block-start: auto` does not. */
    function scrollReport() {
      const turns = Array.from(doc.querySelectorAll(".pokyd-turn"));
      const last = turns[turns.length - 1];
      const overflows = box.scrollHeight > box.clientHeight + 1;
      const rest = box.scrollHeight - box.scrollTop - box.clientHeight;
      /* The gap between the newest sentence and the bottom of the box, which is
         ROZESTUP: :946 subtracts it before the newest as well as between. */
      const gapBelowNewest = Math.round(
        boxRect.bottom - last.getBoundingClientRect().bottom);

      let oldestReachable = null;
      if (overflows) {
        const keep = box.scrollTop;
        box.scrollTop = 0;
        const oldest = turns[0].getBoundingClientRect();
        const now = box.getBoundingClientRect();
        oldestReachable = oldest.top >= now.top - 1 && oldest.bottom <= now.bottom + 1;
        box.scrollTop = keep;
      }
      return { overflows, atBottom: Math.abs(rest) <= 1, gapBelowNewest,
        oldestReachable, turns: turns.length };
    }

    /* The menu: what it offers, and what it admits it cannot do yet. */
    const menuItems = Array.from(doc.querySelectorAll(".pokyd-menu-item"));

    return {
      caption: text(".pokyd-menu-state"),
      headings: {
        left: text(".pokyd-heading-left"),
        title: text(".pokyd-title"),
        right: text(".pokyd-heading-right"),
      },
      colours: {
        human: css(human, "color"),
        pokyd: css(pokyd, "color"),
        heading: css(doc.querySelector(".pokyd-heading-left"), "color"),
        title: css(doc.querySelector(".pokyd-title"), "color"),
        input: css(input, "background-color"),
        inputText: css(input, "color"),
      },
      /* PROSTRED.FU:923-924, measured rather than declared: the four insets of
         the transcript box from the client rectangle, in pixels. */
      box: {
        left: Math.round(boxRect.left - clientRect.left),
        right: Math.round(clientRect.right - boxRect.right),
        top: Math.round(boxRect.top - clientRect.top),
        bottom: Math.round(clientRect.bottom - boxRect.bottom),
      },
      /* Phase 6.5, and the one deviation in the window: :962 stopped drawing at
         the top inset and this box scrolls to it instead.  What is measured is
         the pair of claims that decision rests on -- the view at rest is still
         his, and the history is actually reachable, by keyboard as well as by
         mouse.  `scroll` is read after the conversation, so `atBottom` is the
         state chat.ts's scrollToEnd left it in rather than an initial value. */
      boxOverflow: css(box, "overflow-y"),
      boxTabIndex: box.tabIndex,
      boxLabelled: (box.getAttribute("aria-label") || "").length > 0,
      scroll: scrollReport(),
      /* The page itself still does not: the window is the viewport. */
      pageScrollable:
        doc.documentElement.scrollHeight > doc.documentElement.clientHeight + 1,
      /* PREKRESLI_OBRAZOVKU (:827) loads the bitmap at the window's own size. */
      background: {
        image: css(client, "background-image"),
        size: css(client, "background-size"),
        repeat: css(client, "background-repeat"),
      },
      /* Ours, and never on the screen: IQ Pokyd told the speakers apart by
         colour alone. */
      markerDisplay: css(doc.querySelector(".pokyd-marker"), "display"),
      menu: {
        titles: Array.from(doc.querySelectorAll(".pokyd-menu-title"))
          .map((b) => b.textContent),
        items: menuItems.length,
        separators: doc.querySelectorAll(".pokyd-menu-separator").length,
        bitmaps: doc.querySelectorAll(".pokyd-menu-bitmap img").length,
        enabled: menuItems.filter((b) => !b.disabled)
          .map((b) => b.dataset.command).sort(),
        accelerators: menuItems
          .map((b) => b.querySelector(".pokyd-menu-accelerator").textContent)
          .filter((a) => a.length > 0),
      },
    };
  }

  /* ------------------------------------------------------ the conversation */

  let busySeen = 0;
  for (const sentence of sentences) {
    input.value = sentence;
    /* A submit button inside the form: this is the click, not a call. */
    send.click();
    /* The engine answers in milliseconds, so "busy" can come and go between two
       polls.  Seeing it at all is what says the input was locked while it
       worked; seeing it every time is not something a poll can promise. */
    if (root.dataset.state === "busy") busySeen++;
    await until("an answer to " + sentence,
      () => root.dataset.state === "ready", 30000);
  }

  /* What is on the screen, read back out of the transcript in the order it was
     drawn, and written in the two characters the golden file uses. */
  const all = Array.from(doc.querySelectorAll(".pokyd-turn")).map((li) => ({
    who: li.dataset.who,
    marker: li.querySelector(".pokyd-marker").textContent,
    text: li.querySelector(".pokyd-text").textContent,
  }));
  /* Phase 6.4.  NAPIS_UVODNI_UVITANI put a line on the screen before anything
     was typed (PROSTRED.FU:299, mfcDlg.cpp:443), and its first call writes only
     the computer's half -- `static BYTE prvniveta` at :132 -- so the very first
     turn is IQ Pokyd's and belongs to nobody's sentence.  The golden file is the
     23 that were typed, so the greeting is reported on its own and kept out of
     the transcript below. */
  const greeting = all[0];
  const turns = all.slice(1);
  let transcript = "";
  for (const turn of turns) {
    transcript += (turn.who === "human" ? "> " : "< ") + turn.text + "\r\n";
  }

  /* ------------------------------------------------ the settings dialog, 7.1 */

  /* IDD_NASTAVENI, opened the two ways a visitor can open it and driven the way
     a visitor drives it: F4, the author's own accelerator (IDR_ZKRATKY), and
     the menu item that carries the same command. Everything here happens after
     the conversation and after windowReport() above, because it moves the
     settings the rest of this file measures -- the character it sets and the
     moods F7 and F8 walk through are read back out of the engine at the end.

     Nothing below reaches for a module: the dialog is found in the DOM, the
     lists and the edits are typed into, and what node compares the result with
     is the author's own template. */
  async function dialogReport() {
    const dialog = () => doc.querySelector(".pokyd-dialog");
    const item = (id) =>
      doc.querySelector('.pokyd-dialog-item[data-control="' + id + '"]');
    const input = (id) => {
      const box = item(id);
      return box === null ? null : (box.matches("input, select") ? box
        : box.querySelector("input, select"));
    };
    const shownIds = () =>
      Array.from(doc.querySelectorAll(".pokyd-dialog-item"))
        .filter((el) => !el.hidden).map((el) => el.dataset.control).sort();
    /* TranslateAccelerator, as a page spells it: the handler menu.ts installs
       is on the iframe's own document. */
    /* On whatever has the focus, because that is where a key press lands:
       the dialog listens on itself and an event dispatched at the document
       would never bubble down to it. */
    const press = (key, init = {}) => (doc.activeElement || doc).dispatchEvent(
      new win.KeyboardEvent("keydown",
        { key, bubbles: true, cancelable: true, ...init }));

    const menuItem = doc.querySelector(
      '.pokyd-menu-item[data-command="ID_NASTAVENI"]');
    const out = {
      menuEnabled: menuItem !== null && !menuItem.disabled,
      captionEnabled: !doc.querySelector(".pokyd-menu-state").disabled,
      /* naladabody as the conversation left it, so that the OK below can be
         shown not to have reset it (Nastaveni.cpp:166). */
      moodPointsBefore: (await handle.client.getSettings()).moodPoints,
      /* PRECTI_NASTAVENI_ZE_SOUBORU's own return value for this visit: 0 on a
         first one, and 1 on the second, which reads what the first one wrote.
         Phase 7.3. */
      configStatus: handle.configStatus(),
      /* Read at the top of the visit, before a word was typed. */
      openedOnArrival,
    };

    /* 1. F4 opens it. */
    press("F4");
    await until("the settings dialog", dialog, 5000);
    out.openedByF4 = true;
    out.caption = doc.querySelector(".pokyd-dialog-title").textContent;
    out.modal = dialog().getAttribute("aria-modal");
    out.controls = doc.querySelectorAll(".pokyd-dialog-item").length;
    out.shown = shownIds();
    /* The two group boxes keep the template's own captions now: nothing swaps
       them, because there is no second page to swap them for. */
    out.groups = [item("IDC_RAMECEK1").querySelector("legend").textContent,
      item("IDC_RAMECEK2").querySelector("legend").textContent];
    out.lists = {
      character: Array.from(input("IDC_CHARAKTER").options).map((o) => o.textContent),
      mood: Array.from(input("IDC_NALADA").options).map((o) => o.textContent),
      characterValue: input("IDC_CHARAKTER").value,
      moodValue: input("IDC_NALADA").value,
    };
    out.genders = {
      human: input("IDC_CLOVEKMUZ").checked,
      computer: input("IDC_POCITACMUZ").checked,
    };
    /* Nothing is greyed on this dialog any more: every control that was drawn
       and could not be honoured was on the page that is now dropped. */
    out.disabled = Array.from(doc.querySelectorAll(".pokyd-dialog-item"))
      .filter((el) => {
        const control = el.matches("input, select") ? el
          : el.querySelector("input, select");
        return control !== null && control.disabled;
      }).map((el) => el.dataset.control).sort();

    /* 2. the page that is not there.  Everything the second button showed is
          off the dialog, the two buttons with it -- src/app/dialog.ts DROPPED.
          Checked by absence, which is the only way a cut can be checked. */
    out.droppedFound = ["IDC_ZAKLADNINASTAVENI", "IDC_ROZSIRENENASTAVENI",
      "IDC_EMULOVATKLAVESNICI", "IDC_EMULOVATCESKOUKLAVESNICI",
      "IDC_EMULOVATSLOVENSKOUKLAVESNICI", "IDC_KLAVESNICEQWERTY",
      "IDC_TEXTKEMULACI", "IDC_ZOBRAZOVATSTANDARDNIKURZOR",
      "IDC_NEZOBRAZOVATPOZADI", "IDC_READONLYMOD", "IDC_ZOBRAZOVATPOPISKY"]
      .filter((id) => item(id) !== null);
    /* And what that cut did to the window: the dialog is 13 dialog units
       shorter, which is the row those two buttons stood in, and everything else
       moved up by it.  Measured against IDC_RAMECEK1 rather than in pixels,
       because the pixel is whatever MapDialogRect made of the visitor's font --
       node has the template and can work out both ratios from it. */
    const bodyRect = doc.querySelector(".pokyd-dialog-body").getBoundingClientRect();
    const groupRect = item("IDC_RAMECEK1").getBoundingClientRect();
    const rects = Array.from(doc.querySelectorAll(".pokyd-dialog-item"))
      .map((el) => el.getBoundingClientRect());
    out.rect = {
      /* Nothing fell off the top or out of the bottom. */
      fits: rects.every((r) => r.top >= bodyRect.top - 1
        && r.bottom <= bodyRect.bottom + 1),
      heightInGroups: bodyRect.height / groupRect.height,
      topGapInGroups: (groupRect.top - bodyRect.top) / groupRect.height,
    };

    /* 3. a name that is two words: his MessageBox, and the dialog stays. */
    input("IDC_JMENOCLOVEKA").value = "Michal Novak";
    item("IDOK").click();
    out.refusal = {
      shown: !doc.querySelector(".pokyd-dialog-refusal").hidden,
      title: doc.querySelector(".pokyd-dialog-refusal strong").textContent,
      text: doc.querySelector(".pokyd-dialog-refusal p").textContent,
      stillOpen: dialog() !== null,
      focused: doc.activeElement === input("IDC_JMENOCLOVEKA"),
    };

    /* 4. Storno by way of Escape: nothing at all is applied. */
    press("Escape");
    out.closedByEscape = dialog() === null;
    out.afterCancel = (await handle.client.getSettings()).humanName;

    /* 5. and the menu item opens it too, and OK applies. "stroj" is character
          0, which is as far from the default 3 as the list goes. */
    doc.querySelector(".pokyd-menu-title").click();      /* open the IQ Pokyd menu */
    menuItem.click();
    await until("the settings dialog again", dialog, 5000);
    out.openedFromMenu = true;
    input("IDC_CHARAKTER").value = "0";
    input("IDC_JMENOCLOVEKA").value = "  Michal  ";
    input("IDC_SPISOVNACESTINA").checked = true;
    input("IDC_POUZIVATEFEKTY").checked = true;
    item("IDOK").click();
    out.closedByOk = dialog() === null;
    await until("the settings to reach the engine",
      async () => (await handle.client.getSettings()).character === 0, 5000);
    const applied = await handle.client.getSettings();
    out.applied = {
      character: applied.character,
      humanName: applied.humanName,
      formalCzech: applied.formalCzech,
      useEffects: applied.useEffects,
      /* The mood was not touched, so naladabody must still be where the
         conversation drifted it -- Nastaveni.cpp:166. */
      mood: applied.mood,
      moodPoints: applied.moodPoints,
      /* The two NASTAV_STANDARDNE leaves on that are on the page this port
         does not draw (zobrazovatpopisky and klavesniceqwerty, NASTAVEN.PR:26
         and :43).  OnOK writes the whole struct, so a dialog that read a
         missing checkbox as "not ticked" would clear them here -- which is
         exactly what src/app/dialog.ts's `read()` falls back to avoid. */
      showLabels: applied.showLabels,
      keyboardQwerty: applied.keyboardQwerty,
    };
    out.captionAfterOk = doc.querySelector(".pokyd-menu-state").textContent;
    /* pouzivatefekty is the one setting that shows on the window itself. */
    out.effectsShown = Array.from(doc.querySelectorAll(".pokyd-effect"))
      .filter((el) => !el.hidden).length;

    /* 6. phase 7.4: the four commands that are in no menu at all. F8 is a worse
          mood, F7 a better one, and Ctrl+F8 a worse character. */
    const moodNow = async () => (await handle.client.getSettings()).mood;
    press("F8");
    await until("the mood to worsen", async () => await moodNow() > applied.mood, 5000);
    out.moodAfterF8 = await moodNow();
    press("F7");
    await until("the mood to improve",
      async () => await moodNow() === applied.mood, 5000);
    out.moodAfterF7 = await moodNow();
    press("F8", { ctrlKey: true });
    await until("the character to worsen",
      async () => (await handle.client.getSettings()).character === 1, 5000);
    out.characterAfterCtrlF8 = (await handle.client.getSettings()).character;
    out.captionAfterKeys = doc.querySelector(".pokyd-menu-state").textContent;

    /* 7. phase 7.3, and the reason this runs at all: everything above changed
          the settings, and OnOK wrote them to IQPOKYD.CFG. Put them back
          through the same dialog -- NASTAV_STANDARDNE's own values, the mood
          included -- so that the file the *next* iframe reads is the one the
          golden conversation was recorded under. What node then checks is that
          the text left in storage parses back to exactly those settings, and
          that the second visit started from it rather than from the
          defaults. */
    press("F4");
    await until("the settings dialog a third time", dialog, 5000);
    input("IDC_CHARAKTER").value = String(RESTORE.character);
    input("IDC_NALADA").value = String(RESTORE.mood);
    input("IDC_JMENOCLOVEKA").value = "";
    input("IDC_SPISOVNACESTINA").checked = false;
    input("IDC_POUZIVATEFEKTY").checked = false;
    /* What the OK above left behind, so that the wait below is for this OK's
       own write rather than for a file that happened to be there already:
       ZAPIS_NASTAVENI_DO_SOUBORU is the last thing OnOK does (:207), after the
       settings have reached the engine and the menu has been rewritten. */
    const wrote = win.localStorage.getItem("IQPOKYD.CFG");
    item("IDOK").click();
    out.storedConfig = await until("IQPOKYD.CFG to be written again", () => {
      const text = win.localStorage.getItem("IQPOKYD.CFG");
      return text !== null && text !== wrote ? text : null;
    }, 5000);
    out.restored = await handle.client.getSettings();
    return out;
  }

  /* Read while the iframe is still on the page -- stage.replaceChildren()
     below takes the document with it. */
  const window63 = windowReport();

  /* And again at the end, which is the same number only if the mood never
     moved.  It does move -- INTELIG.FU:532 -- and phase 7.2 is where that
     became something a visitor sees, in the menu bar and in the mood list. */
  const moodAfter = (await handle.client.getSettings()).mood;
  const sentenceCount = await handle.client.sentenceCount();

  /* Last of all, because it is the only thing here that *changes* the settings
     rather than reading them: the dialog sets a character, a name and two
     checkboxes, and the four keyboard shortcuts walk the mood and the
     character one step each. */
  const dialog = await dialogReport();

  const unfreed = await handle.client.close();
  stage.replaceChildren();

  return {
    kind, loadMs, sentenceCount, unfreed, busySeen, moodAfter, dialog,
    captionBefore, window: window63, greeting,
    firstState, loadingShown, loadingGone, inputLive, focused,
    turns: turns.length,
    markers: Array.from(new Set(all.map((t) => t.marker))).sort(),
    whoOrder: turns.map((t) => t.who).join(","),
    emptyAnswers: turns.filter((t) => t.who === "pokyd" && t.text.trim() === "").length,
    title: doc.title,
    lang: doc.documentElement.lang,
    report: { ...report, error: report.error ? report.error.message : null },
    settings: {
      character: settings.character,
      mood: settings.mood,
      humanGender: settings.humanGender,
      computerGender: settings.computerGender,
    },
    transcript: Array.from(encodeCp1250(transcript)),
  };
}

/* -------------------------------------------------------------- the driver */

async function main() {
  const raw = await (await fetch("/test/golden/rozhovor.in")).arrayBuffer();
  /* What the driver's loop does: strip the CR, drop the empty lines
     (mfcDlg.cpp:556). */
  const sentences = decodeCp1250(new Uint8Array(raw))
    .split("\n").map((r) => r.replace(/\r+$/, "")).filter((r) => r.length > 0);
  log("input   " + sentences.length + " sentences, seed " + SEED);

  /* `seed` goes back too, because phase 6.4's welcome line is a function of it
     and node has to be able to work out which of the ten it should be. */
  const out = {
    sentences: sentences.length, seed: SEED,
    where: navigator.userAgent, app: APP,
  };

  log("cold    first visit, the dictionary is inflected...");
  out.cold = await visit({ kind: "cold", sentences });
  log("cold    " + (out.cold.loadMs / 1000).toFixed(2) + " s to ready, "
    + out.cold.turns + " turns, " + (out.cold.report.saved ? "cache saved" : "NO CACHE"));

  log("warm    second visit, from IndexedDB...");
  out.warm = await visit({ kind: "warm", sentences });
  log("warm    " + (out.warm.loadMs / 1000).toFixed(2) + " s to ready, "
    + out.warm.turns + " turns, " + (out.warm.report.hit ? "cache hit" : "NO HIT"));

  /* Two visits, one key: the second one found what the first one wrote. */
  out.sameKey = out.cold.report.key === out.warm.report.key;
  return out;
}

let result;
try {
  result = await main();
} catch (e) {
  result = { error: (e && e.stack) ? e.stack : String(e) };
  log("FAILED: " + result.error);
}
await fetch("/result", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(result),
});
</script>

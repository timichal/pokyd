<!DOCTYPE html>
<!-- IQ Pokyd - test/web/cache.html - phase 4.4 of PLAN.md, in a real browser.

     The browser half of test/web/cache.test.mjs.  test/browser.mjs serves this
     page, strips the types out of the .ts files it imports on the way through,
     and waits for the POST at the bottom.  Nothing here decides whether the run
     passed: it reports, and node judges.

     What this establishes, and what test/web/cache.test.ts could not:

       1. that the whole loop closes.  A first visit inflects the dictionary for
          fifteen seconds and puts the result in IndexedDB; a second visit, with
          its own worker, its own wasm module and its own database connection,
          finds it, hands it to the engine and loads in a fraction of a second.
       2. that what comes back out is the same eighteen megabytes that went in.
          The blob is hashed on the way out of the store and node compares that
          against the hash of build/run/SLOVNIK.TMP, the file the native engine
          wrote -- so the claim is byte-identity with the native cache, through
          a structured clone and a database, and not merely a matching length.
       3. that the conversation is still the golden one, on both visits.  A
          cache that restored *something* plausible and answered differently is
          the failure this whole key scheme exists to prevent.
       4. that the misses miss: a different dictionary hash and a different
          engine version both find nothing, and a damaged record is thrown away
          rather than handed to the engine.

     Written by us, not ported.  English identifiers and ASCII only, like the
     rest of the non-engine code, and no dependencies: it is loaded from a static file server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IQ Pokyd - cache test</title>
</head>
<body>
<pre id="log">running...</pre>
<script type="module">
import {
  fnv1a64, pokydCacheKey, startCached,
  PokydCacheStore, POKYD_CACHE_DB, POKYD_CACHE_STORE, POKYD_CACHE_VERSION,
} from "/src/web/cache.ts";
import { PokydClient } from "/src/web/client.ts";
import { decodeCp1250, encodeCp1250 } from "/src/web/cp1250.ts";

/* The settings the golden conversation was recorded with -- test/golden/README.md.
   Only the mood is set; character 3 and both genders are NASTAV_STANDARDNE's own
   defaults (NASTAVEN.PR:25-43), so rather than write them again this page reads
   them back after the load and lets node say whether they are still what the
   golden file was recorded under. */
const SEED = 20050415;
const MOOD = 3;            /* normalni -- normal */

const URLS = {
  workerUrl: "/src/web/worker.ts",
  moduleUrl: "/build/wasm/pokyd.mjs",
};

const logEl = document.getElementById("log");
const lines = [];
function log(text) {
  lines.push(text);
  logEl.textContent = lines.join("\n");
}

/* --------------------------------------------------------------------- a visit */

/* One visit to the page, from an empty worker to a closed one.  `store` is the
   store it is allowed to use; whether the load is cold or warm is not decided
   here, it is decided by what is in that store -- which is the thing being
   tested. */
async function visit(sentences, { store, kind }) {
  const client = new PokydClient(URLS);

  const t0 = performance.now();
  const report = await startCached(client, {
    store: store, mood: MOOD, seed: SEED,
  });
  const total_ms = performance.now() - t0;

  /* The defaults the golden conversation leans on.  If one of them ever moves,
     this says so here rather than as a mystifying transcript diff. */
  const settings = await client.getSettings();

  let transcript = "";
  for (const sentence of sentences) {
    transcript += "> " + sentence + "\r\n< " + (await client.say(sentence)) + "\r\n";
  }

  const sentence_count = await client.sentenceCount();
  const unfreed = await client.close();

  return {
    kind, total_ms, sentence_count, unfreed,
    report: { ...report, error: report.error ? report.error.message : null },
    settings: {
      character: settings.character,
      mood: settings.mood,
      humanGender: settings.humanGender,
      computerGender: settings.computerGender,
    },
    transcript: Array.from(encodeCp1250(transcript)),
  };
}

/* ------------------------------------------------------------------ raw records */

/* A record written straight into the object store, going round PokydCacheStore
   so that the store can be asked what it makes of one.  Nothing but a test has
   any business doing this. */
function putRaw(record) {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(POKYD_CACHE_DB, 1);
    r.onerror = () => reject(r.error);
    r.onsuccess = () => {
      const db = r.result;
      const t = db.transaction(POKYD_CACHE_STORE, "readwrite");
      t.objectStore(POKYD_CACHE_STORE).put(record);
      t.oncomplete = () => { db.close(); resolve(); };
      t.onerror = () => { db.close(); reject(t.error); };
    };
  });
}

/* --------------------------------------------------------------------- driver */

async function main() {
  const input = await (await fetch("/test/golden/rozhovor.in")).arrayBuffer();
  /* Exactly what the driver's loop does: strip the CR, drop empty lines
     (mfcDlg.cpp:556). */
  const sentences = decodeCp1250(new Uint8Array(input))
    .split("\n").map((r) => r.replace(/\r+$/, "")).filter((r) => r.length > 0);
  log("input   " + sentences.length + " sentences");

  const out = { sentences: sentences.length, where: navigator.userAgent };

  /* A fresh browser profile, so this is a genuine first visit. */
  const first = new PokydCacheStore();
  out.atStart = await first.keys();
  log("store   " + POKYD_CACHE_DB + "/" + POKYD_CACHE_STORE
    + ", " + out.atStart.length + " records");

  /* ---- the first visit: nothing stored, so fifteen seconds and a save ---- */
  log("cold    first visit (nothing in IndexedDB, so the dictionary is inflected)...");
  const cold = await visit(sentences, { store: first, kind: "cold" });
  log("cold    " + (cold.report.loadMs / 1000).toFixed(2) + " s, saved "
    + cold.report.bytes + " bytes under " + cold.report.key);
  out.cold = cold;
  out.afterCold = await first.keys();

  /* Let go of the connection the way a closing tab would. */
  first.close();

  /* ---- what is actually in there, read through a new connection ---- */
  const second = new PokydCacheStore();
  out.keysOnReopen = await second.keys();

  {
    const blob = await second.get(cold.report.key);
    out.stored = blob === null ? null
      : { length: blob.length, hash: fnv1a64(blob) };
    log("store   read back " + (blob ? blob.length : 0) + " bytes, fnv1a64 "
      + (out.stored ? out.stored.hash : "-"));
  }

  /* ---- the misses, which are the whole point of keying it ---- */
  out.dictHash = cold.report.key.split("/").pop();
  out.misses = {
    otherDictionary: await second.get(pokydCacheKey("0000000000000000")) === null,
    otherVersion: await second.get(
      pokydCacheKey(out.dictHash, POKYD_CACHE_VERSION + "-next")) === null,
  };

  /* ---- the second visit: a new worker, a new module, a warm load ---- */
  log("warm    return visit (the stored blob is imported before the load)...");
  const warm = await visit(sentences, { store: second, kind: "warm" });
  log("warm    " + (warm.report.loadMs / 1000).toFixed(2) + " s, hit="
    + warm.report.hit);
  out.warm = warm;

  /* ---- pruning: a stale key must not be left holding 18 MB ---- */
  const stray = pokydCacheKey("ffffffffffffffff", "0");
  await second.put(stray, new Uint8Array([1, 2, 3, 4]));
  out.pruning = { before: (await second.keys()).sort() };
  out.pruning.deleted = await second.pruneExcept(cold.report.key);
  out.pruning.after = (await second.keys()).sort();
  {
    const still = await second.get(cold.report.key);
    out.pruning.kept = still === null ? 0 : still.length;
  }

  /* ---- a damaged record is thrown away, not handed to the engine ---- */
  const damagedKey = pokydCacheKey("deadbeefdeadbeef");
  await putRaw({
    key: damagedKey,
    blob: new Uint8Array(16),
    length: 999999,               /* what it claims, not what it is */
    savedAt: Date.now(),
  });
  out.damaged = {
    wasThere: (await second.keys()).includes(damagedKey),
    returned: await second.get(damagedKey),
    stillThere: (await second.keys()).includes(damagedKey),
  };

  await second.clear();
  out.afterClear = await second.keys();
  second.close();

  out.isolated = self.crossOriginIsolated === true;
  return out;
}

let result;
try {
  result = await main();
} catch (e) {
  result = { error: (e && e.stack) ? e.stack : String(e) };
  log("FAILED: " + result.error);
}
await fetch("/result", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(result),
});
</script>
</body>
</html>

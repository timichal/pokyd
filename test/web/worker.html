<!DOCTYPE html>
<!-- IQ Pokyd - test/web/worker.html - phase 4.2 of PLAN.md, in a real browser.

     The browser half of test/web/worker.test.mjs.  test/browser.mjs serves this
     page, strips the types out of the .ts files it imports on the way through,
     and waits for the POST at the bottom.  Nothing here decides whether the run
     passed: it reports, and node judges.

     What it is here to establish, and what could not be established in node:

       1. that src/web/worker.ts actually runs as a module worker in Chrome,
          importing build/wasm/pokyd.mjs by URL and loading the engine in it
       2. that the main thread stays responsive while it does.  That is the
          whole point of phase 4.2 -- 3.4 measured a 15.3 s synchronous load,
          and the number this page reports is the longest the main thread was
          unable to run a timer during it
       3. that the conversation is still the golden one, through the protocol,
          through the client, through CP1250 in both directions

     Written by us, not ported.  English identifiers and ASCII only, like the
     rest of the non-engine code, and no dependencies: it is loaded from a static file server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IQ Pokyd - worker test</title>
</head>
<body>
<pre id="log">running...</pre>
<script type="module">
import { decodeCp1250, encodeCp1250 } from "/src/web/cp1250.ts";
import { PokydClient } from "/src/web/client.ts";
import { POKYD_PHASE_INFLECTING } from "/src/web/protocol.ts";

/* The settings the golden conversation was recorded with -- test/golden/README.md. */
const SEED = 20050415;
const CHARACTER = 3;       /* prumerny -- average */
const MOOD = 3;            /* normalni -- normal */
const HUMAN_GENDER = 1;    /* muz -- male; NASTAVEN.PR:26 */
const COMPUTER_GENDER = 1;

const logEl = document.getElementById("log");
const lines = [];
function log(text) {
  lines.push(text);
  logEl.textContent = lines.join("\n");
}

/* ------------------------------------------------- the responsiveness probe */

/* A timer that wants to run every 10 ms, and the longest it was kept waiting.
   On the main thread a synchronous load shows up here as one gap the length of
   the whole load; in a worker it should not show up at all.  requestAnimationFrame
   is counted beside it because a frame that never renders is what a visitor
   actually sees. */
function probe() {
  let last = performance.now();
  let gap = 0;
  let ticks = 0;
  let frames = 0;
  const timer = setInterval(() => {
    const now = performance.now();
    gap = Math.max(gap, now - last);
    last = now;
    ticks++;
  }, 10);
  let running = true;
  const frame = () => {
    if (!running) return;
    frames++;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  return {
    stop() {
      running = false;
      clearInterval(timer);
      return { maxStallMs: gap, ticks, frames };
    },
  };
}

/* --------------------------------------------------------------------- a run */

async function oneConversation(sentences, { cache, kind }) {
  const output = { count: 0, duringLoad: 0, percentages: 0, samples: [] };
  let loading = false;

  const client = new PokydClient({
    workerUrl: "/src/web/worker.ts",
    moduleUrl: "/build/wasm/pokyd.mjs",
    onOutput(text, progress) {
      output.count++;
      if (!loading) return;
      output.duringLoad++;
      if (/^\d+\.\d%\s*$/.test(text)) output.percentages++;
      if (output.samples.length < 6
          || (progress.phase === POKYD_PHASE_INFLECTING && output.samples.length < 12)) {
        output.samples.push(text.slice(0, 40) + " [phase " + progress.phase + "]");
      }
    },
  });

  /* Settings through the protocol rather than through start(), so that
     getSettings/setSettings are exercised over the wire the way a real page
     would use them. */
  await client.init();
  const settings = await client.getSettings();
  settings.humanGender = HUMAN_GENDER;
  settings.computerGender = COMPUTER_GENDER;
  settings.character = CHARACTER;
  await client.setSettings(settings);
  await client.setMood(MOOD);
  if (cache) await client.importCache(cache);

  const probeHandle = probe();
  loading = true;
  const t0 = performance.now();
  await client.load();
  const load_ms = performance.now() - t0;
  loading = false;
  const responsiveness = probeHandle.stop();

  await client.seed(SEED);

  let transcript = "";
  const t1 = performance.now();
  for (const sentence of sentences) {
    transcript += "> " + sentence + "\r\n< " + (await client.say(sentence)) + "\r\n";
  }
  const answers_ms = performance.now() - t1;

  const sentence_count = await client.sentenceCount();
  const exported = cache ? null : await client.exportCache();
  const unfreed = await client.close();

  return {
    kind, load_ms, answers_ms, sentence_count, unfreed, output, responsiveness,
    transcript: Array.from(encodeCp1250(transcript)),
    cache: exported,
  };
}

/* --------------------------------------------------------------- the protocol */

/* Two things that are protocol behaviour rather than engine behaviour, and that
   only exist once there is a worker to get them wrong. */
async function protocolTests() {
  const out = {};

  /* A request that arrives before init comes back as a rejection carrying the
     worker's own message, not as a hang. */
  {
    const client = new PokydClient({
      workerUrl: "/src/web/worker.ts",
      moduleUrl: "/build/wasm/pokyd.mjs",
    });
    try {
      await client.say("ahoj");
      out.beforeInit = "(it resolved)";
    } catch (e) {
      out.beforeInit = e.message;
    }
    client.terminate();
  }

  /* Ids do not get crossed: four requests in flight at once, each of which
     knows a different answer, resolved out of any order the worker likes. */
  {
    const client = new PokydClient({
      workerUrl: "/src/web/worker.ts",
      moduleUrl: "/build/wasm/pokyd.mjs",
    });
    await client.init();
    await client.setMood(2);
    const [a, b, c, d] = await Promise.all([
      client.getSettings(), client.progress(), client.sentenceCount(),
      client.getSettings(),
    ]);
    out.concurrent = {
      mood: a.mood, phase: b.phase, count: c, same: a.mood === d.mood,
    };
    client.terminate();
  }

  return out;
}

/* --------------------------------------------------------------------- driver */

async function main() {
  const input = await (await fetch("/test/golden/rozhovor.in")).arrayBuffer();
  /* Exactly what the driver's loop does: strip the CR, drop empty lines
     (mfcDlg.cpp:556). */
  const sentences = decodeCp1250(new Uint8Array(input))
    .split("\n").map((r) => r.replace(/\r+$/, "")).filter((r) => r.length > 0);
  log("input   " + sentences.length + " sentences");

  const runs = [];

  log("cold    loading (an empty MEMFS, so the dictionary gets inflected)...");
  const cold = await oneConversation(sentences, { cache: null, kind: "cold" });
  log("cold    " + (cold.load_ms / 1000).toFixed(2) + " s, main thread"
    + " stalled at most " + cold.responsiveness.maxStallMs.toFixed(0) + " ms");
  const blob = cold.cache;
  runs.push({ ...cold, cache: undefined, cacheLength: blob ? blob.length : 0 });

  if (blob) {
    log("warm    loading (the cache imported first)...");
    const warm = await oneConversation(sentences, { cache: blob, kind: "warm" });
    log("warm    " + (warm.load_ms / 1000).toFixed(2) + " s");
    runs.push({ ...warm, cache: undefined, cacheLength: 0 });
  }

  log("protocol...");
  const protocol = await protocolTests();

  return {
    where: navigator.userAgent,
    isolated: self.crossOriginIsolated === true,
    runs, protocol,
  };
}

let result;
try {
  result = await main();
} catch (e) {
  result = { error: (e && e.stack) ? e.stack : String(e) };
  log("FAILED: " + result.error);
}
await fetch("/result", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(result),
});
</script>
</body>
</html>

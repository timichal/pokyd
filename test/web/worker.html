<!DOCTYPE html>
<!-- IQ Pokyd - test/web/worker.html - phase 4.2 of PLAN.md, in a real browser.

     The browser half of test/web/worker.test.mjs.  test/browser.mjs serves this
     page, strips the types out of the .ts files it imports on the way through,
     and waits for the POST at the bottom.  Nothing here decides whether the run
     passed: it reports, and node judges.

     What it is here to establish, and what could not be established in node:

       1. that src/web/worker.ts actually runs as a module worker in Chrome,
          importing build/wasm/pokyd.mjs by URL and loading the engine in it
       2. that the main thread stays responsive while it does.  That is the
          whole point of phase 4.2 -- 3.4 measured a 15.3 s synchronous load,
          and the number this page reports is the longest the main thread was
          unable to run a timer during it
       3. that the conversation is still the golden one, through the protocol,
          through the client, through CP1250 in both directions

     Written by us, not ported.  ASCII only, like the rest of the non-engine
     code, and no dependencies: it is loaded from a static file server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IQ Pokyd - worker test</title>
</head>
<body>
<pre id="log">running...</pre>
<script type="module">
import { decodeCp1250, encodeCp1250 } from "/src/web/cp1250.ts";
import { PokydClient } from "/src/web/client.ts";
import { POKYD_PHASE_INFLECTING } from "/src/web/protocol.ts";

/* The settings the golden conversation was recorded with -- test/golden/README.md. */
const SEMENO = 20050415;
const CHARAKTER = 3;            /* prumerny */
const NALADA = 3;               /* normalni */
const POHLAVI_CLOVEKA = 1;      /* muz -- NASTAVEN.PR:26 */
const POHLAVI_POCITACE = 1;

const zaznam = document.getElementById("log");
const radky = [];
function pis(text) {
  radky.push(text);
  zaznam.textContent = radky.join("\n");
}

/* ------------------------------------------------- the responsiveness probe */

/* A timer that wants to run every 10 ms, and the longest it was kept waiting.
   On the main thread a synchronous load shows up here as one gap the length of
   the whole load; in a worker it should not show up at all.  requestAnimationFrame
   is counted beside it because a frame that never renders is what a visitor
   actually sees. */
function sonda() {
  let posledni = performance.now();
  let mezera = 0;
  let tiku = 0;
  let snimku = 0;
  const casovac = setInterval(() => {
    const ted = performance.now();
    mezera = Math.max(mezera, ted - posledni);
    posledni = ted;
    tiku++;
  }, 10);
  let bezi = true;
  const snimek = () => {
    if (!bezi) return;
    snimku++;
    requestAnimationFrame(snimek);
  };
  requestAnimationFrame(snimek);
  return {
    konec() {
      bezi = false;
      clearInterval(casovac);
      return { maxPauzaMs: mezera, tiku, snimku };
    },
  };
}

/* --------------------------------------------------------------------- a run */

async function jedenRozhovor(vety, { cache, druh }) {
  const vystup = { pocet: 0, behemNacitani: 0, procenta: 0, ukazky: [] };
  let nacita = false;

  const klient = new PokydClient({
    workerUrl: "/src/web/worker.ts",
    moduleUrl: "/build/wasm/pokyd.mjs",
    onOutput(text, postup) {
      vystup.pocet++;
      if (!nacita) return;
      vystup.behemNacitani++;
      if (/^\d+\.\d%\s*$/.test(text)) vystup.procenta++;
      if (vystup.ukazky.length < 6
          || (postup.phase === POKYD_PHASE_INFLECTING && vystup.ukazky.length < 12)) {
        vystup.ukazky.push(text.slice(0, 40) + " [faze " + postup.phase + "]");
      }
    },
  });

  /* Settings through the protocol rather than through start(), so that
     getSettings/setSettings are exercised over the wire the way a real page
     would use them. */
  await klient.init();
  const nastaveni = await klient.getSettings();
  nastaveni.pohlavicloveka = POHLAVI_CLOVEKA;
  nastaveni.pohlavipocitace = POHLAVI_POCITACE;
  nastaveni.charakter = CHARAKTER;
  await klient.setSettings(nastaveni);
  await klient.setMood(NALADA);
  if (cache) await klient.importCache(cache);

  const merak = sonda();
  nacita = true;
  const t0 = performance.now();
  await klient.load();
  const nacitani_ms = performance.now() - t0;
  nacita = false;
  const responzivita = merak.konec();

  await klient.seed(SEMENO);

  let prepis = "";
  const t1 = performance.now();
  for (const veta of vety) {
    prepis += "> " + veta + "\r\n< " + (await klient.say(veta)) + "\r\n";
  }
  const odpovedi_ms = performance.now() - t1;

  const poctvet = await klient.sentenceCount();
  const vyvezena = cache ? null : await klient.exportCache();
  const neuvolneno = await klient.close();

  return {
    druh, nacitani_ms, odpovedi_ms, poctvet, neuvolneno, vystup, responzivita,
    prepis: Array.from(encodeCp1250(prepis)),
    cache: vyvezena,
  };
}

/* --------------------------------------------------------------- the protocol */

/* Two things that are protocol behaviour rather than engine behaviour, and that
   only exist once there is a worker to get them wrong. */
async function zkouskyProtokolu() {
  const ven = {};

  /* A request that arrives before init comes back as a rejection carrying the
     worker's own message, not as a hang. */
  {
    const klient = new PokydClient({
      workerUrl: "/src/web/worker.ts",
      moduleUrl: "/build/wasm/pokyd.mjs",
    });
    try {
      await klient.say("ahoj");
      ven.predInit = "(it resolved)";
    } catch (e) {
      ven.predInit = e.message;
    }
    klient.terminate();
  }

  /* Ids do not get crossed: four requests in flight at once, each of which
     knows a different answer, resolved out of any order the worker likes. */
  {
    const klient = new PokydClient({
      workerUrl: "/src/web/worker.ts",
      moduleUrl: "/build/wasm/pokyd.mjs",
    });
    await klient.init();
    await klient.setMood(2);
    const [a, b, c, d] = await Promise.all([
      klient.getSettings(), klient.progress(), klient.sentenceCount(),
      klient.getSettings(),
    ]);
    ven.soubezne = {
      nalada: a.nalada, faze: b.phase, vet: c, stejne: a.nalada === d.nalada,
    };
    klient.terminate();
  }

  return ven;
}

/* --------------------------------------------------------------------- driver */

async function main() {
  const vstup = await (await fetch("/test/golden/rozhovor.in")).arrayBuffer();
  /* Exactly what the driver's loop does: strip the CR, drop empty lines
     (mfcDlg.cpp:556). */
  const vety = decodeCp1250(new Uint8Array(vstup))
    .split("\n").map((r) => r.replace(/\r+$/, "")).filter((r) => r.length > 0);
  pis("input   " + vety.length + " sentences");

  const behy = [];

  pis("cold    loading (an empty MEMFS, so the dictionary gets inflected)...");
  const studeny = await jedenRozhovor(vety, { cache: null, druh: "cold" });
  pis("cold    " + (studeny.nacitani_ms / 1000).toFixed(2) + " s, main thread"
    + " stalled at most " + studeny.responzivita.maxPauzaMs.toFixed(0) + " ms");
  const blob = studeny.cache;
  behy.push({ ...studeny, cache: undefined, cacheDelka: blob ? blob.length : 0 });

  if (blob) {
    pis("warm    loading (the cache imported first)...");
    const teply = await jedenRozhovor(vety, { cache: blob, druh: "warm" });
    pis("warm    " + (teply.nacitani_ms / 1000).toFixed(2) + " s");
    behy.push({ ...teply, cache: undefined, cacheDelka: 0 });
  }

  pis("protocol...");
  const protokol = await zkouskyProtokolu();

  return {
    kde: navigator.userAgent,
    isolated: self.crossOriginIsolated === true,
    behy, protokol,
  };
}

let vysledek;
try {
  vysledek = await main();
} catch (e) {
  vysledek = { chyba: (e && e.stack) ? e.stack : String(e) };
  pis("FAILED: " + vysledek.chyba);
}
await fetch("/vysledek", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(vysledek),
});
</script>
</body>
</html>

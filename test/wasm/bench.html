<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>IQ Pokyd - wasm start-up bench</title>
<!--
  IQ Pokyd - test/wasm/bench.html - phase 3.4 of PLAN.md, the browser half.

  node test/wasm/bench.mjs --browser serves this page over 127.0.0.1, launches
  headless Chrome or Edge at it, and waits for the POST at the bottom.  Opening
  it by hand works too, as long as something is serving the repo: file:// cannot
  load an ES module's wasm and cannot be cross-origin isolated.

  It runs test/wasm/bench-core.mjs, the same driving code the node bench runs, so
  the two tables measure the same calls in the same order.  The reason this page
  exists at all is that node is not the target: the plan's question is what a
  browser tab costs, and only a browser can answer it -- especially
  performance.measureUserAgentSpecificMemory(), which needs the cross-origin
  isolation the bench server sends and which is the only per-tab figure a browser
  will hand over.

  Written by us, not ported.  English identifiers and ASCII only, like the
  rest of the non-engine code.
-->
<style>
  body { background: #111; color: #ddd; font: 14px/1.5 Consolas, monospace;
         margin: 2rem; }
  h1 { font-size: 1rem; font-weight: normal; color: #9c9; }
  table { border-collapse: collapse; margin: 1rem 0; }
  th, td { padding: .2rem 1rem .2rem 0; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #888; font-weight: normal; border-bottom: 1px solid #333; }
  .ok { color: #9c9; } .fail { color: #c99; }
  #statusEl { color: #cc9; }
</style>

<h1>IQ Pokyd 0.15 &mdash; WebAssembly start-up cost (PLAN.md 3.4)</h1>
<p id="statusEl">starting...</p>
<div id="tableEl"></div>

<script type="module">
import { measure } from "./bench-core.mjs";

const params = new URLSearchParams(location.search);
const REPEATS = parseInt(params.get("n") || "1", 10);
const NOISE = params.get("noise") === "1";

const statusEl = document.getElementById("statusEl");
function say(text) { statusEl.textContent = text; }

function mb(b) { return b === null || b === undefined ? "--" : (b / 1048576).toFixed(1) + " MB"; }

async function fetchBytes(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) throw new Error(path + ": " + response.status);
  return new Uint8Array(await response.arrayBuffer());
}

function toSentences(input) {
  /* The driver's own loop: strip the CR, drop empty lines (mfcDlg.cpp:556),
     keep every other byte as it lies.  CP1250 in, CP1250 out, no decoding. */
  const sentences = [];
  let start = 0;
  for (let i = 0; i <= input.length; i++) {
    if (i === input.length || input[i] === 0x0a) {
      let end = i;
      while (end > start && input[end - 1] === 0x0d) end--;
      if (end > start) sentences.push(input.slice(start, end));
      start = i + 1;
    }
  }
  return sentences;
}

async function tabMemory() {
  /* Chrome only, and only when crossOriginIsolated -- which is what the bench
     server's Cross-Origin-Opener/Embedder-Policy headers are for.  It may take
     a few seconds: the browser waits for a garbage collection before it
     answers, which is also what makes the answer worth having. */
  if (!self.crossOriginIsolated || !performance.measureUserAgentSpecificMemory) return null;
  try {
    const m = await performance.measureUserAgentSpecificMemory();
    return m.bytes;
  } catch (e) {
    return null;
  }
}

async function main() {
  say("fetching the module and the golden conversation...");
  const { default: PokydModule } = await import("../../build/wasm/pokyd.mjs");
  const sentences = toSentences(await fetchBytes("../golden/rozhovor.in"));
  const golden = await fetchBytes("../golden/rozhovor.txt");

  const runs = [];
  let blob = null;

  for (const cold of [true, false]) {
    for (let i = 0; i < REPEATS; i++) {
      if (!cold && blob === null) break;
      say((cold ? "cold" : "warm") + " run " + (i + 1) + " of " + REPEATS
        + (cold ? " -- inflecting 11,207 words, this is the 14 s one..." : "..."));
      /* A turn of the event loop first, so the status above is painted before a
         synchronous load freezes the tab -- which it does, and phase 4.2's
         worker is the answer to that. */
      await new Promise((a) => setTimeout(a, 50));

      const run = await measure(PokydModule, {
        sentences, golden, noise: NOISE,
        cache: cold ? null : blob,
        want_cache: cold && blob === null,
        /* At the peak, not after the run: by the time measure returns, the module
           is shut down and what it measures is the residue.  This is the whole
           tab with the dictionary loaded, which is what the plan is asking. */
        probe: async () => ({
          tab: await tabMemory(),
          js: performance.memory ? performance.memory.usedJSHeapSize : null,
        }),
      });
      if (run.cache) blob = run.cache;
      runs.push({
        kind: cold ? "cold" : "warm",
        host: run.host && run.host.tab !== null ? run.host.tab
              : (run.host ? run.host.js : null),
        tab: run.host ? run.host.tab : null,
        js: run.host ? run.host.js : null,
        load_ms: run.load_ms, answers_ms: run.answers_ms,
        module_ms: run.module_ms, import_ms: run.import_ms,
        export_ms: run.export_ms, memory: run.memory, memfs: run.memfs,
        unfreed: run.unfreed, sentence_count: run.sentence_count,
        transcript_matches: run.transcript_matches,
      });
      render(runs);
    }
  }

  /* The headline tab figure is the cold run's, taken while it was loaded. */
  const tab = runs.length ? runs[0].tab : null;
  render(runs, tab);

  const failures = runs.filter((b) => b.transcript_matches === false || b.unfreed !== 0).length;
  say(failures === 0
    ? "done -- every run reproduced test/golden/rozhovor.txt and freed every block."
    : "done -- " + failures + " run(s) did not reproduce the golden transcript.");

  /* Back to node, which is what launched this and what prints the table that
     goes in PLAN.md.  Failing to report is not fatal: the page is readable. */
  try {
    await fetch("/result", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ runs, tab, where: navigator.userAgent }),
    });
  } catch (e) { /* opened by hand, with nobody listening */ }
}

function render(runs, tab) {
  const rows = runs.map((b) => `<tr>
    <td>${b.kind}</td>
    <td>${b.load_ms.toFixed(0)}</td>
    <td>${b.answers_ms.toFixed(1)}</td>
    <td>${mb(b.memory.after_load)}</td>
    <td>${mb(b.memfs)}</td>
    <td>${mb(b.js)}</td>
    <td>${mb(b.tab)}</td>
    <td class="${b.transcript_matches && b.unfreed === 0 ? "ok" : "fail"}">${
      b.transcript_matches === false ? "DIFFERS"
        : b.unfreed !== 0 ? "leaked " + b.unfreed : "identical"}</td>
  </tr>`).join("");

  document.getElementById("tableEl").innerHTML = `
    <table>
      <tr><th>run</th><th>load ms</th><th>answers ms</th><th>wasm heap</th>
          <th>memfs</th><th>js heap</th><th>tab</th><th>transcript</th></tr>
      ${rows}
    </table>
    ${tab ? "<p>tab total, per measureUserAgentSpecificMemory(): <b>" + mb(tab)
            + "</b></p>" : ""}
    <p>wasm heap is the linear memory, which only grows &mdash; so it is also the
       peak. MEMFS holds SLOVNIK.TMP outside it, in JS arrays.</p>`;
}

main().catch((e) => {
  say("FAILED: " + (e && e.message ? e.message : e));
  console.error(e);
  fetch("/result", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ error: String(e && e.stack || e) }),
  }).catch(() => {});
});
</script>
</html>
